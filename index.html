<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.link{text-decoration:underline;font-weight:600;padding:2px 0}
/* Layout: panel lateral oscuro + tablero de tarjetas pastel redondeadas sobre crema; en celular, barra inferior oscura. */
:root{
  --bg:#F4EEE2; --surface:#FFFCF6; --surface-2:#EBE3D3; --line:#E0D6C3;
  --ink:#1E1C19; --muted:#6F675B; --side:#1E1C19; --side-ink:#F4EEE2; --side-muted:#A49B8D;
  --butter:#F3DA82; --rose:#F2B6D3; --olive:#AEB672; --lav:#B2C4EE; --mauve:#D5B6CB;
  --on-pastel:#1E1C19; --track:rgba(30,28,25,.14);
  --warn:#B4532A;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-card:28px; --r-row:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141311; --surface:#1F1D1A; --surface-2:#2A2723; --line:#36322C;
  --ink:#F1EBDF; --muted:#A79F92; --side:#0C0B0A; --side-ink:#F1EBDF; --side-muted:#8D8579;
  --butter:#E3C96C; --rose:#E1A3C1; --olive:#9EA762; --lav:#9FB2DD; --mauve:#C3A3B8;
  --on-pastel:#1E1C19; --track:rgba(30,28,25,.18); --warn:#E58A5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141311; --surface:#1F1D1A; --surface-2:#2A2723; --line:#36322C;
  --ink:#F1EBDF; --muted:#A79F92; --side:#0C0B0A; --side-ink:#F1EBDF; --side-muted:#8D8579;
  --butter:#E3C96C; --rose:#E1A3C1; --olive:#9EA762; --lav:#9FB2DD; --mauve:#C3A3B8;
  --on-pastel:#1E1C19; --track:rgba(30,28,25,.18); --warn:#E58A5E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:700;line-height:1.08}
h2{font-size:20px;font-weight:650}
h3{font-size:16px;font-weight:650}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto}
.app.solo{grid-template-columns:minmax(0,1fr);max-width:980px}
.side{background:var(--side);color:var(--side-ink);border-radius:var(--r-card);padding:24px 14px;
  position:sticky;top:max(16px,env(safe-area-inset-top,0px));height:calc(100dvh - 32px);display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;padding:0 10px 18px}
.brand span{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--side-muted);letter-spacing:0}
.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:999px;color:var(--side-muted);font-weight:600;text-align:left}
.nav-btn:hover{color:var(--side-ink)}
.nav-btn[aria-current="page"]{background:var(--side-ink);color:var(--side)}
.side .me-chip{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:999px;color:var(--side-ink);text-align:left}
.side .me-chip:hover{background:rgba(255,255,255,.07)}
.me-chip small{display:block;color:var(--side-muted);font-size:12px}
.bottom{display:none}
.main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:24px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.top .avatar-btn{display:none}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top .avatar-btn{display:block}
  .main{padding-bottom:104px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--side);
    padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
    justify-content:space-around;gap:4px;border-radius:24px 24px 0 0}
  .bottom .nav-btn{flex-direction:column;gap:3px;padding:8px 6px;font-size:11px;border-radius:16px;flex:1;align-items:center;min-width:0}
  .bottom .nav-btn[aria-current="page"]{background:var(--side-ink);color:var(--side)}
}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;min-width:0}
.pastel{border:0;color:var(--on-pastel)}
.pastel .muted,.pastel .eyebrow{color:var(--on-pastel);opacity:.7}
.c-butter{background:var(--butter)}.c-rose{background:var(--rose)}.c-olive{background:var(--olive)}.c-lav{background:var(--lav)}.c-mauve{background:var(--mauve)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
@media (max-width:1060px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.g2{grid-template-columns:minmax(0,1fr)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-sm{padding:7px 14px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:13px;background:var(--surface)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--surface)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.pastel .chip{background:rgba(255,255,255,.55);color:var(--on-pastel)}
/* Controles dentro de tarjetas pastel: mismo contraste en modo claro y oscuro */
.pastel .pill{background:rgba(255,255,255,.62);border-color:transparent;color:var(--on-pastel)}
.pastel .pill .muted{color:var(--on-pastel);opacity:.7}
.pastel .pill[aria-pressed="true"]{background:var(--on-pastel);color:#FFFCF6;border-color:var(--on-pastel)}
.pastel .btn{background:var(--on-pastel);color:#FFFCF6}
.pastel .btn-ghost{background:transparent;color:var(--on-pastel);border-color:rgba(30,28,25,.35)}
.pastel .input{background:rgba(255,255,255,.72);border-color:transparent;color:var(--on-pastel)}
.pastel .input::placeholder{color:rgba(30,28,25,.55)}
.pastel .link{color:var(--on-pastel)}
.pastel :focus-visible{outline-color:var(--on-pastel)}

/* avatar */
.av{border-radius:50%;object-fit:cover;display:inline-grid;place-items:center;flex:none;font-family:var(--display);font-weight:700;color:var(--on-pastel);overflow:hidden}
.av-40{width:40px;height:40px;min-width:40px;font-size:15px}.av-44{width:44px;height:44px;min-width:44px;font-size:16px}.av-32{width:32px;height:32px;min-width:32px;font-size:13px}.av-88{width:88px;height:88px;min-width:88px;font-size:30px}
.av{max-width:none;aspect-ratio:1/1;flex-shrink:0;object-position:center}
.av-24{width:24px;height:24px;min-width:24px;font-size:11px}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.react{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);line-height:1.3}
.react.on{border-color:var(--ink);background:var(--surface-2)}
.pastel .react{background:rgba(255,255,255,.6);border-color:transparent;color:var(--on-pastel)}
.pastel .react.on{background:#fff;border-color:var(--on-pastel)}
.nav-btn{position:relative}
.dot{position:absolute;top:7px;left:26px;width:10px;height:10px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 2px var(--side)}
.bottom .dot{top:5px;left:calc(50% + 6px)}
.cm-btn{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-size:13px;font-weight:700;color:var(--ink);margin-left:auto}
.cm-btn .ic{width:16px;height:16px}
.pastel .cm-btn{border-color:var(--on-pastel);color:var(--on-pastel)}
@media (max-width:480px){.cm-btn{margin-left:0}}
.cmts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.cmt{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.cmt-body{flex:1;min-width:0;background:var(--surface-2);border-radius:14px;padding:7px 12px;overflow-wrap:anywhere}
.pastel .cmt-body{background:rgba(255,255,255,.65)}
.cmt-body small{color:var(--muted);font-size:12px;margin-left:6px}
.pastel .cmt-body small{color:var(--on-pastel);opacity:.65}
.cm-form{display:flex;gap:8px;margin-top:4px}
.cm-form .input{padding:8px 12px;font-size:14px}
.pastel .cm-form .input{background:rgba(255,255,255,.75);border-color:transparent;color:var(--on-pastel)}
.event{padding-top:10px;border-top:1px solid var(--line)}
.pastel .event{border-top-color:rgba(30,28,25,.12)}
.event:first-child{border-top:0;padding-top:0}
.rank{cursor:pointer;text-align:left;width:100%;color:var(--on-pastel)}
.rank:hover{filter:brightness(1.02)}
.person-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border-radius:12px}
img.av{display:inline-block}

/* forms */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px;min-width:0}
.input{width:100%;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:500}
.input:focus{border-color:var(--ink);outline:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.form-row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}

/* today */
.days{display:flex;gap:8px;flex-wrap:wrap}
.goal{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px 12px 12px;border-radius:var(--r-row);background:var(--surface);border:1px solid var(--line);text-align:left;transition:background .15s}
.goal .tile{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--on-pastel);flex:none}
.goal .tile .ic{width:22px;height:22px}
.goal .g-txt{flex:1;min-width:0}
.goal .g-name{font-weight:650;font-size:16px;overflow-wrap:anywhere}
.goal .g-sub{font-size:13px;color:var(--muted)}
.goal .tick{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.goal.done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.goal.done .g-sub{color:var(--bg);opacity:.7}
.goal.done .tick{background:var(--bg);border-color:var(--bg);color:var(--ink)}
.goal:disabled{cursor:not-allowed;opacity:.6}
.stack{display:flex;flex-direction:column;gap:10px}

/* rings / stats */
.stat{display:flex;flex-direction:column;gap:10px;min-height:150px}
.stat .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1}
.stat .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ring{flex:none}
.ring text{font-family:var(--display);font-weight:700;fill:var(--on-pastel)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal .dh{font-size:11px;font-weight:600;color:var(--muted);padding-bottom:2px}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.cal .d.l0{background:var(--surface-2)}
.cal .d.l1{background:color-mix(in srgb,var(--olive) 40%,var(--surface-2))}
.cal .d.l2{background:color-mix(in srgb,var(--olive) 70%,var(--surface-2))}
.cal .d.l3{background:var(--olive);color:var(--on-pastel)}
.cal .d.fut{background:transparent;color:var(--muted)}
.cal .d.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.mini-cal{display:grid;grid-template-columns:repeat(7,10px);gap:4px}
.mini-cal i{width:10px;height:10px;border-radius:50%;background:var(--surface-2)}
.pastel .mini-cal i{background:rgba(255,255,255,.5)}
.mini-cal i.l1{background:color-mix(in srgb,var(--ink) 30%,transparent)}
.mini-cal i.l2{background:color-mix(in srgb,var(--ink) 60%,transparent)}
.mini-cal i.l3{background:var(--ink)}
.pastel .mini-cal i.l1{background:rgba(30,28,25,.3)}.pastel .mini-cal i.l2{background:rgba(30,28,25,.6)}.pastel .mini-cal i.l3{background:var(--on-pastel)}
.mini-cal i.blank{background:transparent}

/* bars */
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:999px}
.prog-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center}
.prog-row .tile{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--on-pastel)}
.prog-row .tile .ic{width:18px;height:18px}

/* group */
.rank{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-radius:24px}
.rank .pos{font-family:var(--display);font-weight:700;font-size:20px;width:24px;text-align:center}
.rank .who{min-width:0}
.rank .who b{font-size:16px;overflow-wrap:anywhere}
.rank .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
@media (max-width:560px){.rank{grid-template-columns:auto minmax(0,1fr) auto}.rank .pos{display:none}.rank .mini-cal{display:none}}

/* metrics */
.metric{display:flex;flex-direction:column;gap:4px}
.metric .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1}
.metric .v small{font-family:var(--body);font-size:13px;font-weight:600;opacity:.7;margin-left:3px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
.chart svg{width:100%;height:auto;display:block}

/* welcome */
.hero{display:flex;flex-direction:column;gap:10px;padding:8px 4px 4px}
.hero .brand-line{font-family:var(--display);font-weight:700;font-size:22px}
.wcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.wcards{grid-template-columns:minmax(0,1fr)}}
.wcard{display:flex;gap:14px;align-items:flex-start;padding:20px}
.wcard .wi{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.55);display:grid;place-items:center;flex:none}
.wcard p{font-size:14.5px;margin-top:4px}
.quote{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);font-weight:600;line-height:1.2;text-wrap:balance;padding:6px 4px}
.photo-pick{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

/* switch */
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ink);border-color:var(--ink)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--bg)}
.check-row{display:flex;align-items:center;gap:10px;font-weight:500}
.check-row input{width:18px;height:18px;accent-color:var(--ink)}

/* sheet & toast */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(20,19,17,.45);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .panel{width:min(520px,100%);max-height:100%;overflow:auto;background:var(--bg);border-radius:var(--r-card);padding:24px;display:flex;flex-direction:column;gap:18px}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:16px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.18)}
@media (min-width:821px){.toast{bottom:28px}}
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--surface-2);font-size:14px}
.banner .ic{color:var(--warn);margin-top:1px}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.win{display:flex;gap:18px;align-items:center;padding:24px}
.win .trophy{font-size:56px;line-height:1;flex:none}

const toUTC=s=>{const[y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const fromUTC=t=>{const d=new Date(t);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())};
const addDays=(s,n)=>fromUTC(toUTC(s)+n*864e5);
const dow=s=>(new Date(toUTC(s)).getUTCDay()+6)%7;
const weekStart=s=>addDays(s,-dow(s));

const daysInMonth=k=>{const[y,m]=k.split('-').map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate()};

/* ---------- cálculo ---------- */
const isActive=(g,d)=>d>=g.created&&(!g.archived||d<g.archived);
const isDone=(p,g,d)=>{const c=p.checks&&p.checks[d];return Array.isArray(c)&&c.includes(g.id)};
function goalProgress(p,g,start,end){
  let active=0,done=0;
  eachDay(start,end,d=>{if(isActive(g,d)){active++;if(isDone(p,g,d))done++}});
  if(!active)return null;
  const len=daysBetween(start,end)+1;
  let t=g.freq==='daily'?active:g.freq==='weekly'?g.target*active/7:g.target*active/(len>=28?len:daysInMonth(monthKey(start)));
  t=Math.max(1,Math.round(t));
  return {done,target:t,ratio:Math.min(1,done/t)};
}
function periodScore(p,start,end){
  let s=0,n=0;
  for(const g of p.goals||[]){const r=goalProgress(p,g,start,end);if(r){s+=r.ratio;n++}}
  return n?s/n:null;
}
function streak(start,pred,today=T0){
  let best=0,run=0;
  if(start>today)return{cur:0,best:0};
  eachDay(start,today,d=>{if(pred(d)){run++;if(run>best)best=run}else run=0});
  let cur=0,d=pred(today)?today:addDays(today,-1);
  while(d>=start&&pred(d)){cur++;d=addDays(d,-1)}
  return{cur,best};
}
const anyCheck=p=>d=>(p.checks&&p.checks[d]||[]).length>0;
function weekStreak(p,g){
  const wk=weekStart(T0);let cur=0;
  const met=w=>{let c=0;eachDay(w,addDays(w,6),d=>{if(isDone(p,g,d))c++});return c>=g.target};
  let w=met(wk)?wk:addDays(wk,-7);
  while(w>=weekStart(g.created)&&met(w)){cur++;w=addDays(w,-7)}
  return cur;
}
function achievements(p,day){
  const out=[];
  for(const g of p.goals||[]){
    if(!isActive(g,day)||!isDone(p,g,day))continue;
    const k=monthKey(day),ms=monthStart(k),mr=goalProgress(p,g,ms,monthEnd(k));
    let c=0;eachDay(ms,day,d=>{if(isDone(p,g,d))c++});
    if(mr&&c===mr.target&&g.created<=ms){out.push({g,level:'month',txt:`${g.name}: ${mr.target} de ${mr.target} en ${MESES[Number(k.slice(5))-1]}`});continue}
    if(g.freq==='monthly')continue;
    const ws=weekStart(day),wr=goalProgress(p,g,ws,addDays(ws,6));
    let w=0;eachDay(ws,day,d=>{if(isDone(p,g,d))w++});
    if(wr&&w===wr.target)out.push({g,level:'week',txt:`${g.name}: ${wr.target} de ${wr.target} esta semana`});
  }
  return out;
}
function dayLevel(p,d){
  const goals=(p.goals||[]).filter(g=>isActive(g,d));
  const n=(p.checks&&p.checks[d]||[]).filter(id=>goals.some(g=>g.id===id)).length;
  if(!n||!goals.length)return 0;
  const f=n/goals.length;return f>.66?3:f>.33?2:1;
}

}

}

/* ---------- guardado ---------- */
function makeSaver(getRef,getBody){
  let writing=false,dirty=false;
  async function flush(){
    writing=true;let retried=false;
    while(dirty){
      dirty=false;
      try{await getRef().set(JSON.parse(JSON.stringify(getBody())));retried=false}
      catch(e){
        const code=e&&e.code;
        if((code==='unavailable')&&!retried){retried=true;dirty=true;await new Promise(r=>setTimeout(r,400+Math.random()*600));continue}
        onWriteError(code);break;
      }
    }
    writing=false;
  }
  return{save(){dirty=true;if(!writing)flush()},busy(){return writing||dirty}};
}

function onWriteError(code){
  if(code==='invalid_argument'){toast('No se pudo guardar por permisos. Si te acabas de registrar, espera a que te aprueben.',6000)}
  else if(code==='not_found')toast('No se encontró la base de datos de Firestore. Revisa el nombre en FIRESTORE_DB.',7000);
  else if(code==='quota_exceeded')toast('Se llenó el espacio de la app. Borra registros viejos de tus métricas para seguir guardando.');
  else toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
  render();
}

const CC_SORTED=CCODES.map(c=>c[0]).sort((a,b)=>b.length-a.length);
function splitPhone(d){d=String(d||'');for(const c of CC_SORTED)if(d.startsWith(c)&&d.length-c.length>=6)return[c,d.slice(c.length)];return['',d]}
/* Acepta el número con o sin "+": siempre se guarda con código de país.
   Si escriben solo 10 dígitos, se asume México (+52). */
function normPhone(v){const raw=String(v||'').trim();if(!raw||raw==='+')return '';let d=raw.replace(/\D/g,'');
  if(d.startsWith('00'))d=d.slice(2);
  if(!raw.startsWith('+')&&d.length===10)d='52'+d;
  if(d.startsWith('521')&&d.length===13)d='52'+d.slice(3);
  return d.length>=8&&d.length<=15?d:null}

  const g=n.length===10?`${n.slice(0,3)} ${n.slice(3,6)} ${n.slice(6)}`:n.length===9?`${n.slice(0,3)} ${n.slice(3,6)} ${n.slice(6)}`:n.length===8?`${n.slice(0,4)} ${n.slice(4)}`:n;return `+${c} ${g}`}

/* Mejoras en métricas compartidas: solo se celebran avances, nunca retrocesos. */
const BETTER={musculo:1,masaGrasa:-1,visceral:-1};
function metricChanges(q){
  const sh=q&&q.share&&q.share.enabled?(q.share.fields||[]).filter(f=>METRICS.some(m=>m.k===f)):[];
  const es=(Array.isArray(q&&q.inbodyShared)?q.inbodyShared:[]).filter(e=>e&&typeof e.date==='string').sort((a,b)=>a.date.localeCompare(b.date));
  return sh.map(f=>{const w=es.filter(e=>typeof e[f]==='number');if(!w.length)return null;const mm=METRICS.find(m=>m.k===f);
    const last=w[w.length-1],prev=w.length>1?w[w.length-2]:null,d=prev?last[f]-prev[f]:null;
    const improved=prev&&BETTER[f]?Math.sign(d)===BETTER[f]&&Math.abs(d)>=(mm.dec?0.1:1):false;
    return{f,mm,last,prev,d,improved}}).filter(Boolean);
}
function metricWin(id){
  const ch=metricChanges(people[id]).filter(x=>x.improved);if(!ch.length)return null;
  const date=ch.map(x=>x.last.date).sort().pop();
  const items=ch.filter(x=>x.last.date===date).map(x=>{const v=fmtNum(Math.abs(x.d),x.mm.dec);
    return x.f==='visceral'?`bajó ${v} ${Math.abs(x.d)===1?'nivel':'niveles'} de grasa visceral`:x.f==='musculo'?`subió ${v} kg de masa muscular`:`bajó ${v} kg de masa grasa`});
  return{date,items};
}

function calendar(p,k){

  for(let i=1;i<=n;i++){const d=k+'-'+pad(i);const fut=d>T0;const lv=fut?0:dayLevel(p,d);
    cells+=`<span class="d ${fut?'fut':'l'+lv} ${d===T0?'today':''}" title="${fmtShort(d)}">${i}</span>`}
  return `<div class="cal">${cells}</div>`;

function miniCal(p,k){

function niceTicks(min,max,n=4){
  if(min===max){min-=1;max+=1}
  const raw=(max-min)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),e=raw/mag;
  const step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];
  for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(6));
  return{t,lo,hi,step};
}
function lineChart(pts,m){
  if(pts.length<2)return `<p class="muted">${pts.length?'Agrega otro registro para ver la tendencia.':'Aún no hay registros de '+m.label.toLowerCase()+'.'}</p>`;
  const W=640,H=230,L=48,R=18,Tp=14,B=30;
  const xs=pts.map(p=>toUTC(p.date)),x0=Math.min(...xs),x1=Math.max(...xs);
  const ys=pts.map(p=>p.v),{t,lo,hi,step}=niceTicks(Math.min(...ys),Math.max(...ys));
  const X=v=>L+(x1===x0?0.5:(v-x0)/(x1-x0))*(W-L-R),Y=v=>Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B);
  const dec=step<1?1:0;
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(xs[i]).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const area=`${line}L${X(xs[xs.length-1]).toFixed(1)},${Y(lo)}L${X(xs[0]).toFixed(1)},${Y(lo)}Z`;
  const grid=t.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)}" text-anchor="end" dominant-baseline="central" font-size="11" fill="var(--muted)">${fmtNum(v,dec)}</text>`).join('');
  const lblIdx=pts.length<=4?pts.map((_,i)=>i):[0,Math.floor((pts.length-1)/2),pts.length-1];
  const xl=lblIdx.map(i=>`<text x="${X(xs[i])}" y="${H-8}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="11" fill="var(--muted)">${fmtShort(pts[i].date)}</text>`).join('');
  const last=pts[pts.length-1];
  const dots=pts.map((p,i)=>`<circle cx="${X(xs[i])}" cy="${Y(p.v)}" r="${i===pts.length-1?5.5:3}" fill="${i===pts.length-1?'var(--ink)':'var(--surface)'}" stroke="var(--ink)" stroke-width="2"><title>${fmtShort(p.date)}: ${fmtNum(p.v,m.dec)} ${m.unit}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(m.label)}: último valor ${fmtNum(last.v,m.dec)} ${m.unit}">${grid}
    <path d="${area}" fill="color-mix(in srgb,var(--lav) 40%,transparent)"/><path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round"/>${dots}${xl}</svg>`;
}

    const em=CEL_EMOJIS.includes(c.emoji)?c.emoji:'🎉';const who=c.person&&people[c.person];
    return `<div class="card pastel c-mauve win"><span class="trophy" aria-hidden="true">${em}</span><div style="min-width:0;flex:1"><span class="eyebrow">Celebración especial</span><h2 class="win-title">${esc(c.title)}</h2>${c.msg?`<p>${esc(c.msg)}</p>`:''}${who?`<div style="display:flex;align-items:center;gap:10px;margin-top:10px">${avatar(c.person,44)}<b>${esc(who.name)}</b></div>`:''}</div></div>`}).join('');
}
function rankRange(a,b){

    .sort((x,y)=>(y.s??-1)-(x.s??-1)||(x.p.name||'').localeCompare(y.p.name||'')));
}
function podiumCard(title,list,sub){
  const pods=[1,2,3].map(pl=>list.filter(x=>x.place===pl));
  if(!pods[0].length)return '';

     ${xs.length?`<span style="display:flex;justify-content:center">${xs.map(x=>avatar(x.id,pl===1?44:40)).join('')}</span><b class="pod-name">${xs.map(x=>esc(x.p.name)).join(' y ')}</b><span class="num pod-pct">${Math.round(xs[0].s*100)}%</span>`:'<span class="muted">—</span>'}
     <span class="pod-label">${pl}.º lugar</span></div>`};
  return `<div class="card"><div class="card-head"><div><h2>${title}</h2>${sub?`<p class="muted" style="font-size:13px">${sub}</p>`:''}</div>${ico('trophy')}</div>
     <div class="podium">${col(2,'c-lav')}${col(1,'c-butter')}${col(3,'c-rose')}</div></div>`;

const firstFullMonth=q=>{const j=q.joined||T0;return j.slice(8)==='01'?monthKey(j):addMonths(monthKey(j),1)};
function ownerName(){return (adminDoc.ownerId&&nameOf(adminDoc.ownerId))||'Quien administra el reto'}
function inviteLink(){return location.origin+location.pathname+'?ref='+encodeURIComponent(uid)}

   `<div class="grid g-main">

function densePlaces(list){let place=0,prev=null;for(const x of list){if(x.s==null||x.s<=0){x.place=null;continue}if(x.s!==prev){place++;prev=x.s}x.place=place}return list}

function compressPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error('type'));
    const fr=new FileReader();fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('img'));img.onload=()=>{
      const S=200,c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');
      const s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,S,S);
      res(c.toDataURL('image/jpeg',.82))};img.src=fr.result};
    fr.readAsDataURL(file);
  });
}
function addGoal(name,freq,target,icon,note){
  name=String(name||'').trim().slice(0,50);
  if(!name){toast('Escribe el nombre de la meta.');return false}
  const goals=myDoc.goals||(myDoc.goals=[]);
  if(goals.filter(g=>!g.archived).length>=12){toast('Puedes tener hasta 12 metas activas. Archiva alguna para agregar otra.');return false}
  const max=freq==='weekly'?7:31;target=freq==='daily'?1:Math.max(1,Math.min(max,Math.round(Number(target)||1)));
  const used=goals.filter(g=>!g.archived).map(g=>g.color);
  const color=PALETTE.find(c=>!used.includes(c))||PALETTE[goals.length%5];
  goals.push({id:uid8(),name,freq,target,icon:icon||'target',color,created:T0,archived:null,note:note||null});
  saveMe();note?toast(`Meta agregada: ${name}. ${note}`,9000):toast(`Meta agregada: ${name}`);return true;
}

  'auth/operation-not-allowed':'Este método de acceso no está activado en Firebase (Authentication → Sign-in method).',
  'auth/too-many-requests':'Demasiados intentos. Espera unos minutos.','auth/network-request-failed':'Sin conexión. Revisa tu internet.'};
  toast(m[c]||'No se pudo iniciar sesión. Intenta de nuevo.',6500)}
const mapCode=c=>c==='permission-denied'?'invalid_argument':c==='not-found'?'not_found':c==='resource-exhausted'?'quota_exceeded':c==='unavailable'?'unavailable':'unknown';
function makeDb(fs){
  return{
    doc:path=>({
      set:d=>setDoc(fdoc(fs,path),d).catch(e=>{throw{code:mapCode(e&&e.code)}}),
      merge:d=>setDoc(fdoc(fs,path),d,{merge:true}).catch(e=>{throw{code:mapCode(e&&e.code)}}),
      delete:()=>deleteDoc(fdoc(fs,path)),
      onSnapshot:(next,err)=>onSnapshot(fdoc(fs,path),s=>next({exists:s.exists(),data:()=>s.data()}),e=>err&&err({code:mapCode(e&&e.code)}))
    }),
    collection:path=>({
      onSnapshot:(next,err)=>onSnapshot(fcol(fs,path),q=>next({docs:q.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e=>err&&err({code:mapCode(e&&e.code)}))
    })
  };
}
let subs=[],peopleUnsub=null,peopleMode=null,gotAdmin=false,gotPeople=false,cheersUnsub=null;
const typing=()=>document.activeElement&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName);
function maybeReady(){if(gotAdmin&&gotPeople&&status==='loading'){status='ready';render()}else if(status==='ready'&&!typing())render()}
function syncRoster(){
  const ids=[adminDoc.ownerId,...(adminDoc.approved||[])].filter(Boolean);const r={};
  for(const id of ids){if(people[id]&&people[id].name)r[id]=people[id].name;else if(adminDoc.roster&&adminDoc.roster[id])r[id]=adminDoc.roster[id]}
  if(JSON.stringify(r)!==JSON.stringify(adminDoc.roster||{})){adminDoc.roster=r;adminSaver.save()}
}
function onPeople(next){
  if(myDoc&&meSaver.busy())next[uid]=myDoc;
  people=next;
  if(!meSaver.busy())myDoc=next[uid]?JSON.parse(JSON.stringify(next[uid])):null;
  if(myDoc){myDoc.goals=myDoc.goals||[];myDoc.checks=myDoc.checks||{};myDoc.share=myDoc.share||{enabled:false,fields:[]};people[uid]=myDoc}
  if(isOwnerV&&gotAdmin)syncRoster();
  gotPeople=true;maybeReady();
}
function subscribePeople(){
  const mode=isApproved()?'all':'self';
  if(mode===peopleMode)return;
  if(peopleUnsub)peopleUnsub();peopleMode=mode;
  if(mode==='all'&&!cheersUnsub)cheersUnsub=db.collection('cheers').onSnapshot(snap=>{const n={};for(const d of snap.docs){const v=d.data();if(v)n[d.id]=v}cheers=n;if(status==='ready'&&!typing())render()},()=>{});
  if(mode==='all')peopleUnsub=db.collection('people').onSnapshot(snap=>{const n={};for(const d of snap.docs){const v=d.data();if(v&&typeof v.name==='string')n[d.id]=v}onPeople(n)},
    ()=>{peopleMode=null;if(peopleUnsub)peopleUnsub();peopleUnsub=db.doc('people/'+uid).onSnapshot(s=>{const n={};if(s.exists){const v=s.data();if(v&&typeof v.name==='string')n[uid]=v}onPeople(n)},()=>{gotPeople=true;maybeReady()})});
  else peopleUnsub=db.doc('people/'+uid).onSnapshot(s=>{const n={};if(s.exists){const v=s.data();if(v&&typeof v.name==='string')n[uid]=v}onPeople(n)},()=>{gotPeople=true;maybeReady()});
}
function resetSession(){
  subs.forEach(u=>{try{u()}catch(_){}});subs=[];if(cheersUnsub){try{cheersUnsub()}catch(_){}}cheersUnsub=null;cheers={};myContact={phone:''};allContacts={};state.openThread=null;if(peopleUnsub){try{peopleUnsub()}catch(_){}}peopleUnsub=null;peopleMode=null;
  gotAdmin=false;gotPeople=false;people={};myDoc=null;inbody={entries:[]};adminDoc=ADMIN_DEFAULT();isOwnerV=false;TABS=[...BASE_TABS];state.sheet=false;
}
function init(){
  render();
  if(!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey.startsWith('PEGA')){status='offline';render();return}
  let app;try{app=initializeApp(FIREBASE_CONFIG)}catch(_){status='offline';render();return}
  auth=getAuth(app);db=makeDb(getFirestore(app,FIRESTORE_DB));
  onAuthStateChanged(auth,u=>{
    resetSession();
    if(!u){uid=null;userEmail='';status='signedout';render();return}
    uid=u.uid;userEmail=u.email||'';
    isOwnerV=!!u.email&&u.emailVerified&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase();
    if(isOwnerV){TABS=[...BASE_TABS,['admin','Admin','lock']];try{if(location.hash==='#admin')state.tab='admin'}catch(_){}}
    else if(state.tab==='admin')state.tab='hoy';
    status='loading';render();
    subs.push(db.doc('admin/settings').onSnapshot(s=>{
      if(!adminSaver.busy()){
        const v=s.exists?s.data():{};
        adminDoc={celebrations:Array.isArray(v.celebrations)?JSON.parse(JSON.stringify(v.celebrations)):[],hidden:Array.isArray(v.hidden)?[...v.hidden]:[],ownerId:v.ownerId||null,
          sponsors:v.sponsors&&typeof v.sponsors==='object'?{...v.sponsors}:{},approved:Array.isArray(v.approved)?[...v.approved]:[],roster:v.roster&&typeof v.roster==='object'?{...v.roster}:{},approvedAt:v.approvedAt&&typeof v.approvedAt==='object'?{...v.approvedAt}:{},approvedTs:v.approvedTs&&typeof v.approvedTs==='object'?{...v.approvedTs}:{}};
        if(isOwnerV&&adminDoc.ownerId!==uid){adminDoc.ownerId=uid;adminSaver.save()}
      }
      gotAdmin=true;subscribePeople();if(isOwnerV&&gotPeople)syncRoster();maybeReady();
    },()=>{gotAdmin=true;subscribePeople();maybeReady()}));
    subs.push(db.doc('contact/'+uid).onSnapshot(s=>{const v=s.exists?s.data():null;myContact={phone:v&&typeof v.phone==='string'?v.phone:''};if(status==='ready'&&!typing())render()},()=>{}));
    if(isOwnerV)subs.push(db.collection('contact').onSnapshot(snap=>{const n={};for(const d of snap.docs){const v=d.data();if(v&&typeof v.phone==='string')n[d.id]={phone:v.phone}}allContacts=n},()=>{}));
    subs.push(db.doc('private/'+uid).onSnapshot(s=>{
      if(ibSaver.busy())return;
      const v=s.exists?s.data():null;inbody={entries:Array.isArray(v&&v.entries)?JSON.parse(JSON.stringify(v.entries)):[]};
      if(status==='ready'&&state.tab==='metricas'&&!typing())render();
    },()=>{}));
  });
}
init();
</script>
